[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textfold"
dynamic = ["version"]
description = "Zoom any text from every word to a one-screen map: papers, READMEs, Wikipedia and your agent's replies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Xia Chen" }]
keywords = ["reading", "stretchtext", "semantic zoom", "arxiv", "summarization", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "beautifulsoup4",
    "lxml",
    "Pillow",
    "markdown-it-py",
    "mdit-py-plugins",
    "latex2mathml",
    "trafilatura>=2.0",
    "lxml_html_clean",   # trafilatura needs it (through justext's lxml[html_clean]), which an older pip leaves out
    "mammoth",
    "openpyxl",
    # PDFs that have their words in them, read without the PDF engine; only where it comes built (elsewhere it would
    # need Rust to install, and the engine reads those PDFs, as before)
    'pdf-inspector>=1.25,<2; sys_platform == "darwin" or (sys_platform == "win32" and platform_machine == "AMD64") or (sys_platform == "linux" and (platform_machine == "x86_64" or platform_machine == "aarch64"))',
    "pypdfium2>=4.30,<5.12",   # such a PDF's figures, cut from their pages; 5.11 is the last that runs on macOS 12
]

[project.optional-dependencies]
cloud = ["keyring>=25.6,<26", "websockets>=15,<16"]
# only for the Anthropic API (Claude Code, Codex, Pi and OpenAI-compatible providers need nothing more)
anthropic = ["anthropic"]

[project.scripts]
textfold = "textfold.__main__:main"

[project.urls]
Homepage = "https://github.com/chenxiachan/textfold"
Gallery = "https://chenxiachan.github.io/textfold/gallery/"
Issues = "https://github.com/chenxiachan/textfold/issues"

[tool.setuptools]
packages = ["textfold"]

[tool.setuptools.dynamic]
version = { attr = "textfold.__version__" }

[tool.setuptools.package-data]
textfold = ["web/*", "web/**/*"]
