<!doctype html>
<html lang="en" class="app landing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 44 44%27%3E%3Crect width=%2744%27 height=%2744%27 rx=%2710%27 fill=%27%23FAF9F7%27/%3E%3Crect x=%278%27 y=%2711%27 width=%2728%27 height=%275%27 rx=%272.5%27 fill=%27%236B5CE7%27/%3E%3Crect x=%278%27 y=%2720%27 width=%2719%27 height=%275%27 rx=%272.5%27 fill=%27%236B5CE7%27 opacity=%270.4%27/%3E%3Crect x=%278%27 y=%2729%27 width=%2710%27 height=%275%27 rx=%272.5%27 fill=%27%23E08A3C%27/%3E%3C/svg%3E">
<title>TextFold</title>
{{HEAD}}
<link rel="stylesheet" href="/static/reader.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside id="sidebar"></aside>
<main id="landing">
  <div class="ui-top">
  <button type="button" class="ui-help" id="ui-help"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.5 1.65c-.5.22-.8.6-.8 1.15v.35"/><circle cx="8" cy="11.4" r=".4" fill="currentColor"/></svg><span id="ui-help-t"></span></button>
  <label class="ui-lang" id="ui-lang-box"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.8 2.5 3.9 2.5 6.2S9.7 12.4 8 14.2C6.3 12.4 5.5 10.3 5.5 8S6.3 3.6 8 1.8z"/></svg><select id="ui-lang"></select></label>
  </div>
  <section class="hero">
    <svg class="hero-mark" viewBox="0 0 20 20" aria-hidden="true"><rect class="m1" x="2" y="3" width="16" height="2.4" rx="1.2"/><rect class="m2" x="2" y="8.8" width="11" height="2.4" rx="1.2"/><rect class="m3" x="2" y="14.6" width="5" height="2.4" rx="1.2"/></svg>
    <h1>TextFold</h1>
    <p class="lede" id="h-tagline"></p>
    <p class="err" id="storage-error" role="alert" hidden></p>
    <form id="newform" autocomplete="off">
      <div class="bar">
        <svg class="bar-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 11.5l3-3"/><path d="M10.6 5.4l1.1-1.1a3 3 0 0 1 4.2 4.2l-1.1 1.1"/><path d="M9.4 14.6l-1.1 1.1a3 3 0 0 1-4.2-4.2l1.1-1.1"/></svg>
        <input id="ref" name="ref" spellcheck="false" autofocus>
        <span class="bar-sep" aria-hidden="true"></span>
        <label class="sel"><span id="l-lang"></span><select id="lang"></select></label>
        <button id="go" type="submit" class="primary"><span id="go-t"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
      </div>
      <div class="sources" id="sources"></div>
      <div class="err" id="err" hidden></div>
      <button type="button" class="dropzone" id="dropzone"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V3.5"/><path d="M6.5 7L10 3.5 13.5 7"/><path d="M4 12.5v2.2c0 .9.7 1.6 1.6 1.6h8.8c.9 0 1.6-.7 1.6-1.6v-2.2"/></svg><span class="dz-text"><span id="dropzone-t"></span><small id="dropzone-k"></small></span></button>
      <button type="button" class="zlib-open" id="zlib-open"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5h3v13H4z"/><path d="M8.5 3.5h3v13h-3z"/><path d="M13 4.2l2.8-.7 2.6 12.3-2.8.7z"/></svg><span id="zlib-open-t"></span></button>
      <input type="file" id="file" accept=".pdf,.docx,.doc,.rtf,.pptx,.ppt,.xlsx,.xls,.odt,.ods,.odp,.epub,.html,.htm,.mhtml,.mht,.csv,.tsv,.ofd,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.jp2,.md,.markdown,.mdown,.txt" hidden>
    </form>
    <div class="model-line"><span id="model-label"></span><button id="open-settings" type="button" class="linkbtn"></button></div>
    <div id="connect" class="connect" hidden></div>
    <div id="jobcard" class="jobcard" hidden></div>
  </section>
</main>
<script id="boot" type="application/json">{{BOOT}}</script>
<script src="/static/i18n.js"></script>
<script src="/static/tutorial.js"></script>
<script src="/static/app.js"></script>
<script src="/static/webmcp.js"></script>
</body>
</html>
